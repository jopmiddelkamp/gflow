name: CI

on:
  push:
    branches: [master, develop]
    tags: ['v*']
  pull_request:
    branches: [master, develop]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all
      - run: cargo build --release

  # Deliberately outside the release `needs:` chain below: a broken plugin
  # manifest must fail CI, but it must not block shipping the binary.
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @anthropic-ai/claude-code
      # Not --strict: the plugin deliberately declares no `version`, so updates
      # resolve by commit and users never sit on a stale cached copy. --strict
      # would treat that missing field as an error.
      - run: claude plugin validate .

  # Actions tag filters cannot express "v* but not v*-rc.N", so the exclusion is
  # an `if:` here. It is stated ONCE: every job below reaches the release path
  # through a strict `needs:` chain, and a job whose dependency was skipped is
  # skipped too.
  release:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: test
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: gflow-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: gflow-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: gflow-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Rename binary
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/gflow.exe ${{ matrix.artifact }}.exe
          else
            cp target/${{ matrix.target }}/release/gflow ${{ matrix.artifact }}
            chmod +x ${{ matrix.artifact }}
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}

  create-release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/gflow-macos-x86_64/gflow-macos-x86_64
            artifacts/gflow-macos-aarch64/gflow-macos-aarch64
            artifacts/gflow-windows-x86_64/gflow-windows-x86_64.exe

  update-homebrew:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute SHA256 and update formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA_ARM=$(sha256sum artifacts/gflow-macos-aarch64/gflow-macos-aarch64 | cut -d' ' -f1)
          SHA_X86=$(sha256sum artifacts/gflow-macos-x86_64/gflow-macos-x86_64 | cut -d' ' -f1)

          echo "Version: $VERSION"
          echo "SHA256 ARM: $SHA_ARM"
          echo "SHA256 x86: $SHA_X86"

          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/jopmiddelkamp/homebrew-tap.git tap
          cd tap

          cat > Formula/gflow.rb << 'FORMULA'
          class Gflow < Formula
            desc "gflow - a customized gitflow workflow CLI"
            homepage "https://github.com/jopmiddelkamp/gflow"
            version "VERSION_PLACEHOLDER"
            license "Apache-2.0"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/jopmiddelkamp/gflow/releases/download/v#{version}/gflow-macos-aarch64"
                sha256 "SHA_ARM_PLACEHOLDER"
              else
                url "https://github.com/jopmiddelkamp/gflow/releases/download/v#{version}/gflow-macos-x86_64"
                sha256 "SHA_X86_PLACEHOLDER"
              end
            end

            def install
              bin.install stable.url.split("/").last => "gflow"
            end
          end
          FORMULA

          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" Formula/gflow.rb
          sed -i "s/SHA_ARM_PLACEHOLDER/${SHA_ARM}/g" Formula/gflow.rb
          sed -i "s/SHA_X86_PLACEHOLDER/${SHA_X86}/g" Formula/gflow.rb
          # Remove leading whitespace from heredoc
          sed -i 's/^          //' Formula/gflow.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/gflow.rb
          git diff --cached --quiet && echo "Formula already up to date" || {
            git commit -m "chore: update gflow to ${VERSION}"
            git push
          }

  publish-chocolatey:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: gflow-windows-x86_64
          path: artifacts

      - name: Update checksum and publish
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $checksum = (Get-FileHash -Path "artifacts\gflow-windows-x86_64.exe" -Algorithm SHA256).Hash.ToLower()

          Write-Host "Version: $version"
          Write-Host "Checksum: $checksum"

          # Update checksum in install script
          $installScript = Get-Content "packaging\chocolatey\tools\chocolateyinstall.ps1" -Raw
          $installScript = $installScript -replace '__CHECKSUM__', $checksum
          Set-Content "packaging\chocolatey\tools\chocolateyinstall.ps1" -Value $installScript

          # Pack from the chocolatey directory so tools/ is included
          Push-Location "packaging\chocolatey"
          choco pack "gflow.nuspec" --version $version
          Pop-Location

          # Push to Chocolatey community repo
          choco push "packaging\chocolatey\gflow.$version.nupkg" --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
